apiVersion: v1
kind: ConfigMap
metadata:
  name: boom-config
  namespace: umn-babamul
data:
  config.yaml: |
    database:
      host: mongo
      port: 27017
      name: boom
      max_pool_size: 200
      replica_set: null
      username: mongoadmin
      password: ""
      srv: false
    cutouts_storage:
      type: mongo
      host: mongo
      port: 27017
      name: boom
      max_pool_size: 200
      replica_set: null
      username: mongoadmin
      password: ""
      srv: false
    api:
      domain: "localhost"
      port: 4000
      auth:
        secret_key: ""
        token_expiration: 604800
        admin_username: admin
        admin_password: ""
        admin_email: admin@example.com
    babamul:
      enabled: false
      webapp_url:
      retention_days: 3
    redis:
      host: valkey
      port: 6379
    kafka:
      consumer:
        ztf:
          server: "broker:29092"
          group_id: "boom-ztf-nrp"
        lsst:
          server: "usdf-alert-stream-dev.lsst.cloud:9094"
          schema_registry: "https://usdf-alert-schemas-dev.slac.stanford.edu"
          schema_github_fallback_url: "https://github.com/lsst/alert_packet/tree/main/python/lsst/alert/packet/schema"
          group_id: ""
          username: ""
          password: ""
        decam:
          server: "broker:29092"
          group_id: ""
      producer:
        server: "broker:29092"
    workers:
      ztf:
        command_interval: 500
        filter_refresh_interval_minutes: 15
        alert:
          n_workers: 3
        enrichment:
          n_workers: 3
        filter:
          n_workers: 3
      lsst:
        command_interval: 500
        filter_refresh_interval_minutes: 15
        alert:
          n_workers: 4
        enrichment:
          n_workers: 3
        filter:
          n_workers: 1
      decam:
        command_interval: 500
        filter_refresh_interval_minutes: 15
        alert:
          n_workers: 1
        enrichment:
          n_workers: 0
        filter:
          n_workers: 1
    crossmatch:
      ztf:
        - catalog: PS1_DR1
          radius: 2.0
          use_distance: false
          projection:
            _id: 1
            gMeanPSFMag: 1
            gMeanPSFMagErr: 1
            rMeanPSFMag: 1
            rMeanPSFMagErr: 1
            iMeanPSFMag: 1
            iMeanPSFMagErr: 1
            zMeanPSFMag: 1
            zMeanPSFMagErr: 1
            yMeanPSFMag: 1
            yMeanPSFMagErr: 1
            ra: 1
            dec: 1
        - catalog: Gaia_DR3
          radius: 2.0
          use_distance: false
          projection:
            _id: 1
            parallax: 1
            parallax_error: 1
            phot_g_mean_mag: 1
            phot_bp_mean_mag: 1
            phot_rp_mean_mag: 1
            ra: 1
            dec: 1
        - catalog: milliquas_v6
          radius: 2.0
          use_distance: false
          projection:
            _id: 1
            Name: 1
            Descrip: 1
            Qpct: 1
            ra: 1
            dec: 1
        - catalog: NED
          radius: 300.0
          use_distance: true
          distance_key: "z"
          distance_max: 30.0
          distance_max_near: 300.0
          projection:
            _id: 1
            ra: 1
            dec: 1
            objtype: 1
            z: 1
            z_unc: 1
            z_tech: 1
            z_qual: 1
            DistMpc: 1
            DistMpc_unc: 1
            ebv: 1
            m_Ks: 1
            m_Ks_unc: 1
            tMASSphot: 1
            Mstar: 1
            Mstar_unc: 1
      lsst: []
      decam: []
